name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  corpus-parser:
    name: DjVu corpus parser
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run DjVuDump parser self-test
        shell: pwsh
        run: pwsh .\tools\tests\corpus\fetch-corpus.ps1 -ParserSelfTest

  build:
    name: ${{ matrix.configuration }} ${{ matrix.platform }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Release
            platform: Win32
            arch: x86
            pe_machine: 014c
            nmake_args: SIMD=1
            output: src\Release\WinDjView.exe
          - configuration: Release
            platform: x64
            arch: x64
            pe_machine: 8664
            nmake_args: X64=1 SIMD=1
            output: src\Release_x64\WinDjView.exe
          - configuration: Debug
            platform: Win32
            arch: x86
            pe_machine: 014c
            nmake_args: DEBUG=1
            output: src\Debug\WinDjView.exe
          - configuration: Debug
            platform: x64
            arch: x64
            pe_machine: 8664
            nmake_args: X64=1 DEBUG=1
            output: src\Debug_x64\WinDjView.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up NASM for Release SIMD build
        if: matrix.configuration == 'Release'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        with:
          version: 2.16.03

      - name: Build bundled libdjvu and WinDjView
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.arch }} -host_arch=x64
          cd src\libdjvu
          nmake /nologo /f makefile ${{ matrix.nmake_args }}
          cd ..
          nmake /nologo /f makefile ${{ matrix.nmake_args }}

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = '${{ matrix.output }}'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected build output was not created: $exe"
          }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
            throw "Expected a PE executable: $exe"
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length -or
              [BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550) {
            throw "Invalid PE header: $exe"
          }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne [Convert]::ToUInt16('${{ matrix.pe_machine }}', 16)) {
            throw "Unexpected PE machine 0x$('{0:X4}' -f $machine): $exe"
          }
          Get-Item -LiteralPath $exe | Select-Object FullName, Length
          if ('${{ matrix.configuration }}' -eq 'Release') {
            $vsDevCmd = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat'
            $imports = & cmd.exe /d /c "call `"$vsDevCmd`" -arch=${{ matrix.arch }} -host_arch=x64 && dumpbin /imports `"$exe`""
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin /imports failed for $exe"
            }
            $dlls = @($imports | Where-Object { $_ -match '^\s+[A-Za-z0-9_.-]+\.dll\s*$' } |
              ForEach-Object { $_.Trim() })
            if ($dlls.Count -eq 0) {
              throw "dumpbin did not report imported DLLs for $exe"
            }
            Write-Host 'Imported DLLs:'
            $dlls
            $bundledCodecDll = $dlls | Where-Object { $_ -match '(?i)(jpeg|djvu)' } |
              Select-Object -First 1
            if ($bundledCodecDll) {
              throw "Unexpected external bundled-codec dependency: $bundledCodecDll"
            }
          }

      - name: Run JPEGDecoder regression tests
        if: always()
        shell: cmd
        run: tools\tests\run-jpegdecoder-regression.cmd ${{ matrix.configuration }} ${{ matrix.platform }}

      - name: Run Release startup smoke test
        if: always() && matrix.configuration == 'Release'
        shell: pwsh
        run: tools\tests\run-startup-smoke.ps1 -ExecutablePath '${{ matrix.output }}'

      - name: Run libdjvu core regression tests
        if: always()
        shell: cmd
        run: tools\tests\run-libdjvu-core-regression.cmd ${{ matrix.configuration }} ${{ matrix.platform }}

      - name: Run PathUtil regression tests
        if: always()
        shell: cmd
        run: tools\tests\run-pathutil-regression.cmd ${{ matrix.configuration }} ${{ matrix.platform }}

      - name: Run long-path DjVu regression tests
        if: always()
        shell: cmd
        run: tools\tests\run-long-path-djvu-regression.cmd ${{ matrix.configuration }} ${{ matrix.platform }} legacy

      - name: Run DjVuSource long-path regression tests
        if: always()
        shell: cmd
        run: tools\tests\run-djvusource-long-path-regression.cmd ${{ matrix.configuration }} ${{ matrix.platform }} legacy

      - name: Build Russian resource DLL
        if: always()
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.arch }} -host_arch=x64
          msbuild src\Languages\Russian\WinDjViewRU.Modern.vcxproj /nologo /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}

      - name: Verify Russian resource DLL
        if: always()
        shell: pwsh
        run: |
          $ruDirectory = if ('${{ matrix.platform }}' -eq 'x64') { "src\${{ matrix.configuration }}_x64" } else { "src\${{ matrix.configuration }}" }
          $ruDll = Join-Path $ruDirectory 'WinDjViewRU-${{ matrix.platform }}.dll'
          if (-not (Test-Path -LiteralPath $ruDll)) { throw "Expected Russian resource DLL was not created: $ruDll" }
          $bytes = [System.IO.File]::ReadAllBytes($ruDll)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Expected a PE resource DLL: $ruDll" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550) { throw "Invalid PE header: $ruDll" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne [Convert]::ToUInt16('${{ matrix.pe_machine }}', 16)) { throw "Unexpected Russian DLL machine 0x$('{0:X4}' -f $machine): $ruDll" }
          Get-Item -LiteralPath $ruDll | Select-Object FullName, Length

      - name: Upload executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WinDjView-${{ matrix.configuration }}-${{ matrix.platform }}
          path: ${{ matrix.output }}
          if-no-files-found: error

      - name: Upload Russian resource DLL
        if: success() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: WinDjViewRU-${{ matrix.platform }}
          path: src\Release${{ matrix.platform == 'x64' && '_x64' || '' }}\WinDjViewRU-${{ matrix.platform }}.dll
          if-no-files-found: error

  native-msbuild:
    name: native MSBuild ${{ matrix.configuration }} ${{ matrix.platform }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            platform: Win32
            arch: x86
            pe_machine: 014c
            output: src\Debug\WinDjView.exe
          - configuration: Release
            platform: Win32
            arch: x86
            pe_machine: 014c
            output: src\Release\WinDjView.exe
          - configuration: Debug
            platform: x64
            arch: x64
            pe_machine: 8664
            output: src\Debug_x64\WinDjView.exe
          - configuration: Release
            platform: x64
            arch: x64
            pe_machine: 8664
            output: src\Release_x64\WinDjView.exe
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up NASM for Release SIMD build
        if: matrix.configuration == 'Release'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        with:
          version: 2.16.03

      - name: Build native MSBuild application and libdjvu
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.arch }} -host_arch=x64
          msbuild src\WinDjView.Native.vcxproj /nologo /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}

      - name: Verify native executable
        shell: pwsh
        run: |
          $exe = '${{ matrix.output }}'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Expected native MSBuild output was not created: $exe" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Expected a native MSBuild PE executable: $exe" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length -or [BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550) { throw "Invalid PE header: $exe" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne [Convert]::ToUInt16('${{ matrix.pe_machine }}', 16)) { throw "Unexpected PE machine 0x$('{0:X4}' -f $machine): $exe" }
          if ('${{ matrix.configuration }}' -eq 'Release') {
            $vsDevCmd = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat'
            $imports = & cmd.exe /d /c "call `"$vsDevCmd`" -arch=${{ matrix.arch }} -host_arch=x64 && dumpbin /imports `"$exe`""
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /imports failed for $exe" }
            $dlls = @($imports | Where-Object { $_ -match '^\s+[A-Za-z0-9_.-]+\.dll\s*$' } | ForEach-Object { $_.Trim() })
            $bundledCodecDll = $dlls | Where-Object { $_ -match '(?i)(jpeg|djvu)' } | Select-Object -First 1
            if ($bundledCodecDll) { throw "Unexpected external bundled-codec dependency: $bundledCodecDll" }
          }

      - name: Run native long-path DjVu regression tests
        if: always()
        shell: cmd
        run: tools\tests\run-long-path-djvu-regression.cmd ${{ matrix.configuration }} ${{ matrix.platform }} native

      - name: Run native Release startup smoke test
        if: always() && matrix.configuration == 'Release'
        shell: pwsh
        run: tools\tests\run-startup-smoke.ps1 -ExecutablePath '${{ matrix.output }}'

      - name: Run native JPEGDecoder regression tests
        if: always()
        shell: cmd
        run: tools\tests\run-jpegdecoder-regression.cmd ${{ matrix.configuration }} ${{ matrix.platform }} native

      - name: Run native libdjvu core regression tests
        if: always()
        shell: cmd
        run: tools\tests\run-libdjvu-core-regression.cmd ${{ matrix.configuration }} ${{ matrix.platform }} native

      - name: Run native PathUtil regression tests
        if: always()
        shell: cmd
        run: tools\tests\run-pathutil-regression.cmd ${{ matrix.configuration }} ${{ matrix.platform }}

      - name: Run native DjVuSource long-path regression tests
        if: always()
        shell: cmd
        run: tools\tests\run-djvusource-long-path-regression.cmd ${{ matrix.configuration }} ${{ matrix.platform }}
